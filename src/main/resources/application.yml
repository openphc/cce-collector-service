# ============================================================
# CCE Collector Service — Base Configuration
# ============================================================

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: ${TOMCAT_THREADS_MAX:200}

spring:
  application:
    name: cce-collector-service

  lifecycle:
    timeout-per-shutdown-phase: 30s

  # ---------- Jackson ----------
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # ---------- DataSource (PostgreSQL + HikariCP) ----------
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/ccedb}
    username: ${SPRING_DATASOURCE_USERNAME:cce_user}
    password: ${SPRING_DATASOURCE_PASSWORD:cce_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:600000}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
      pool-name: cce-collector-pool

  # ---------- JPA / Hibernate ----------
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  # ---------- Flyway ----------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # ---------- Kafka ----------
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: ${SPRING_KAFKA_PRODUCER_ACKS:all}
      retries: ${SPRING_KAFKA_PRODUCER_RETRIES:3}
      properties:
        enable.idempotence: true
        # How long a send may wait for broker metadata before it fails.
        # The emitter waits longer than max.block.ms + publish-timeout-seconds. See publish-timeout-seconds.
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:3000}
        max.in.flight.requests.per.connection: 5
        linger.ms: ${KAFKA_LINGER_MS:5}
        batch.size: ${KAFKA_BATCH_SIZE:16384}
        buffer.memory: ${KAFKA_BUFFER_MEMORY:33554432}

# ---------- Actuator ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# ---------- CCE Collector Settings ----------
cce:
  collector:
    dedup:
      lookback-days: ${CCE_COLLECTOR_DEDUP_LOOKBACK_DAYS:30}
    # Tries again the stored events that were rejected because the Collector failed
    # (REJECTED with KAFKA_PUBLISH_FAILURE or INTERNAL_ERROR). Off by default.
    # Example: turn it on after a Kafka outage, until the waiting events are published.
    republish:
      enabled: ${CCE_COLLECTOR_REPUBLISH_ENABLED:false}
      interval-ms: ${CCE_COLLECTOR_REPUBLISH_INTERVAL_MS:60000}
      batch-size: ${CCE_COLLECTOR_REPUBLISH_BATCH_SIZE:500}
    max-payload-size: ${CCE_COLLECTOR_MAX_PAYLOAD_SIZE:1048576}
    fhir:
      strict-validation: ${CCE_COLLECTOR_FHIR_STRICT_VALIDATION:false}
      patient-identifier-system: ${CCE_COLLECTOR_FHIR_PATIENT_IDENTIFIER_SYSTEM:http://openphc.org/identifier/upid}
  kafka:
    topics:
      # Bound by cce-common-util's KafkaTopicProperties — the same key the Matcher Service reads to
      # find the topic it consumes from.
      inbound-events: ${CCE_KAFKA_TOPICS_INBOUND_EVENTS:cce.events.inbound}
    # The emitter's timeout for a call to the Collector must be longer than
    # max.block.ms + publish-timeout-seconds (3 s + 10 s here, emitter: 15 s).
    # If it is shorter, the emitter gives up and retries while this publish is still running.
    publish-timeout-seconds: ${CCE_COLLECTOR_KAFKA_PUBLISH_TIMEOUT_SECONDS:10}
    topic-config:
      partitions: ${CCE_COLLECTOR_KAFKA_TOPIC_PARTITIONS:25}
      replication-factor: ${CCE_COLLECTOR_KAFKA_TOPIC_REPLICATION_FACTOR:1}
      retention-ms: ${CCE_COLLECTOR_KAFKA_TOPIC_RETENTION_MS:604800000}
      cleanup-policy: ${CCE_COLLECTOR_KAFKA_TOPIC_CLEANUP_POLICY:delete}
      min-insync-replicas: ${CCE_COLLECTOR_KAFKA_TOPIC_MIN_INSYNC_REPLICAS:1}

# ---------- Logging ----------
logging:
  level:
    root: INFO
    org.openphc.cce.collector: INFO
    org.springframework.kafka: WARN
    org.hibernate.SQL: WARN
